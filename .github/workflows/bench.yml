name: bench
on: [push]
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: 硬件详情
        run: |
          echo "===== CPU ====="
          lscpu | grep -E "Model name|^CPU\(s\)|MHz|Thread|Core"
          echo "===== 内存 ====="
          free -h | grep -E "Mem|Swap"
          echo "===== 磁盘 ====="
          df -h / | tail -1
          echo "===== 系统 ====="
          uname -a; cat /etc/os-release | grep PRETTY
          echo "===== 单核CPU性能(bc 1M位圆周率计时) ====="
          sudo apt-get install -y -qq bc time >/dev/null 2>&1
          time (echo "scale=300; 4*a(1)" | bc -l > /dev/null)
          echo "===== 多核(编译一个小程序计时) ====="
          nproc
